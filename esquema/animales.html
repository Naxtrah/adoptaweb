<header class="navbar navbar-expand-lg bg-success">
<div class="container-fluid">
<a class="navbar-brand text-white fw-bold" href="index.html">AdoptaWeb</a>

<button class="btn btn-success">Filtrar</button>
</div>
<div class="row g-4">
<div class="col-md-6 col-lg-4">
<div class="card h-100">
<div class="placeholder-image" style="height:200px; background-color:#d4edda"></div>
<div class="card-body">
<h5 class="card-title">Firulais</h5>
<p class="card-text">Perro, 2 años, tamaño mediano.</p>
<a href="animal.html" class="btn btn-success">Ver ficha</a>
</div>
</div>
</div>
<div class="col-md-6 col-lg-4">
<div class="card h-100">
<div class="placeholder-image" style="height:200px; background-color:#d4edda"></div>
<div class="card-body">
<h5 class="card-title">Miau</h5>
<p class="card-text">Gato, 1 año, tamaño pequeño.</p>
<a href="animal.html" class="btn btn-success">Ver ficha</a>
</div>
</div>
</div>
<div class="col-md-6 col-lg-4">
<div class="card h-100">
<div class="placeholder-image" style="height:200px; background-color:#d4edda"></div>

<h5 class="card-title">Luna</h5>

</div>

<label class="form-check-label" for="filtroPerro">Perro</label>
</div>
<div class="form-check">
<input class="form-check-input" type="checkbox" id="filtroGato">
<label class="form-check-label" for="filtroGato">Gato</label>
</div>
<div class="form-check">
<input class="form-check-input" type="checkbox" id="filtroPequeno">
<label class="form-check-label" for="filtroPequeno">Pequeño</label>
</div>
<div class="form-check">
<input class="form-check-input" type="checkbox" id="filtroMediano">
<label class="form-check-label" for="filtroMediano">Mediano</label>
