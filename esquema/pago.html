<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>AdoptaWeb — Pago</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
<link rel="stylesheet" href="style.css"/>
</head>
<body>
<header class="navbar navbar-expand-lg bg-success">
<div class="container-fluid">
<a class="navbar-brand text-white fw-bold" href="index.html">AdoptaWeb</a>
</div>
</header>

<main class="container my-5">
<h2>Plataforma de pago</h2>
<div class="progress mb-4">
<div class="progress-bar bg-success" role="progressbar" style="width:33%">Paso 1</div>
</div>
<div class="card p-4 mb-3">
<h5>Paso 1: Datos del titular</h5>
<input type="text" class="form-control mb-2" placeholder="Nombre completo"/>
<input type="text" class="form-control mb-2" placeholder="Dirección"/>
</div>
<div class="progress mb-4">
<div class="progress-bar bg-success" role="progressbar" style="width:66%">Paso 2</div>
</div>
<div class="card p-4 mb-3">
<h5>Paso 2: Método de pago</h5>
<input type="text" class="form-control mb-2" placeholder="Número de tarjeta"/>
<input type="text" class="form-control mb-2" placeholder="Fecha vencimiento"/>
<input type="text" class="form-control mb-2" placeholder="CVC"/>
</div>
<div class="progress mb-4">
<div class="progress-bar bg-success" role="progressbar" style="width:100%">Paso 3</div>
</div>
<div class="card p-4">
<h5>Paso 3: Confirmar pago</h5>
<button class="btn btn-success btn-lg">Confirmar y pagar</button>
</div>
</main>

<footer class="footer mt-auto py-4 bg-success">
<div class="container text-white">© 2025 AdoptaWeb — Contacto • Privacidad • Términos</div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
